name: Validate compiler and browser embedding

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check document links
        run: python3 test/documents.py
      - name: Select compiler checks
        id: changes
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_REV^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_REV" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
            if grep -qE '^(src/|web/|test/|\.github/|Makefile$|VERSION$)' "$RUNNER_TEMP/changed-files"; then
              echo 'code=true' >> "$GITHUB_OUTPUT"
            else
              echo 'code=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  compiler:
    needs: documents
    if: needs.documents.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-sanitize]
    steps:
      - uses: actions/checkout@v6
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.12
      - name: Install comparison tools
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Install pinned WAT assembler
        run: |
          # Ubuntu 24.04's Binaryen 108 cannot parse our linear WAT syntax.
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            --output "$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/binaryen-version_133/bin/wasm-as" --version
      - name: Verify both compiler hosts
        run: |
          # setup-emsdk's PATH need not expose its bundled Node executable.
          export PATH="$RUNNER_TEMP/binaryen-version_133/bin:$PATH"
          "$EMSDK_NODE" --version
          wasm-as --version
          make ${{ matrix.target }} NODE="$EMSDK_NODE"

  embedding:
    needs: documents
    if: needs.documents.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.12
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Allow the downloaded Chrome sandbox on Ubuntu
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Grant user namespaces to this browser only, as Ubuntu does for its
          # packaged Chrome. Retain Chrome's sandbox and the runner's global policy.
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && \
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            chrome_path="$(readlink -f "$CHROME_BINARY")"
            sudo tee /etc/apparmor.d/pas2wasm-ci-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile pas2wasm-ci-chrome "$chrome_path" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/pas2wasm-ci-chrome
          fi
      - name: Build public assets
        run: make site
      - name: Test independent browser integration
        env:
          P2W_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          P2W_CHROMEDRIVER_BINARY: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          export PATH="$(dirname "$P2W_CHROMEDRIVER_BINARY"):$PATH"
          "$P2W_CHROME_BINARY" --version
          chromedriver --version
          python3 test/embedding.py --browser chromium
